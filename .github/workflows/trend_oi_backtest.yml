name: Trend + OI confirmation backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "تعداد روز (پیش‌فرض ثبت‌شده: 365)"
        default: "365"
        required: false
      exchange:
        description: "okx (پیش‌فرض ثبت‌شده)"
        default: "okx"
        required: false

jobs:
  trend_oi:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run trend + OI backtest
        env:
          TOI_DAYS: ${{ github.event.inputs.days }}
          TOI_EXCHANGE: ${{ github.event.inputs.exchange }}
          BT_FEE: "0.0006"
        run: python trend_oi_backtest.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trend-oi-backtest-results
          path: |
            trend_oi_trades.csv
            trend_oi_summary.txt
