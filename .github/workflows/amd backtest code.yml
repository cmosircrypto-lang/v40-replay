name: AMD backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "تعداد روزِ بک‌تست"
        default: "100"
        required: false
      fee:
        description: "کارمزد هر طرف (مثلاً 0.0006)"
        default: "0.0006"
        required: false

jobs:
  amd:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v40-replay

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run AMD backtest
        env:
          AMD_DAYS: ${{ github.event.inputs.days }}
          BT_FEE: ${{ github.event.inputs.fee }}
        run: python amd_backtest.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amd-backtest-results
          path: |
            amd_trades.csv
            amd_summary.txt
