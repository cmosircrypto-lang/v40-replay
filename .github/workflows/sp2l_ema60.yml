name: SP2L_EMA60 backtest (88 symbols, Toobit 15m, descriptive)

on:
  workflow_dispatch: {}

jobs:
  sp2l:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install deps
        run: pip install ccxt numpy

      - name: Run backtest
        run: python sp2l_ema60_backtest.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sp2l-ema60-results
          path: sp2l_ema60_backtest_summary.txt
