name: Funding depth check

on:
  workflow_dispatch:

jobs:
  depth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Check funding history depth
        run: python funding_depth_check.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: funding-depth-report
          path: funding_depth_report.txt
