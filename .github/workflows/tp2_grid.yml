name: SL/TP ATR grid on version files (Toobit 15m)

on:
  workflow_dispatch: {}

jobs:
  grid:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt openpyxl

      - name: Run grid
        run: python tp2_grid.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tp2-grid-results
          path: tp2_grid_summary.txt
