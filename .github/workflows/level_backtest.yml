name: Level-touch early entry backtest (PDH/PDL)

on:
  workflow_dispatch: {}

jobs:
  lvl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run level-touch backtest
        env:
          LVL_EXCHANGE: okx
          BT_FEE: "0.0006"
        run: python level_backtest.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lvl-backtest-results
          path: |
            lvl_trades.csv
            lvl_summary.txt
