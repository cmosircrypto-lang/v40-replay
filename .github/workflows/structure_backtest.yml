name: Structure backtest

on:
  workflow_dispatch:
    inputs:
      days:
        description: "تعداد روز (پیش‌فرض ثبت‌شده: 365)"
        default: "365"
        required: false
      exchange:
        description: "okx (پیش‌فرض) | gateio | kucoin"
        default: "okx"
        required: false

jobs:
  structure:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run structure backtest
        env:
          SKL_DAYS: ${{ github.event.inputs.days }}
          SKL_EXCHANGE: ${{ github.event.inputs.exchange }}
          BT_FEE: "0.0006"
        run: python structure_backtest.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: structure-backtest-results
          path: |
            structure_trades.csv
            structure_summary.txt
