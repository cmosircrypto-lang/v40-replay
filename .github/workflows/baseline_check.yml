name: Baseline structure check (no signal)

on:
  workflow_dispatch: {}

jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run baseline check
        env:
          BASE_EXCHANGE: okx
          BT_FEE: "0.0006"
        run: python baseline_check.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: baseline-results
          path: baseline_summary.txt
