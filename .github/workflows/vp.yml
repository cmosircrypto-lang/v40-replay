name: VP_A backtest (88 symbols, Toobit 15m, exploratory)

on:
  workflow_dispatch: {}

jobs:
  vp:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install deps
        run: pip install ccxt numpy

      - name: Run backtest
        run: python vp_backtest.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vp-a-results
          path: vp_a_backtest_summary.txt
