name: Candle depth check (OKX)

on:
  workflow_dispatch: {}

jobs:
  depth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run candle depth check
        env:
          CD_EXCHANGE: okx
        run: python candle_depth_check.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candle-depth-results
          path: candle_depth.txt
