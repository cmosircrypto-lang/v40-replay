name: Path after signals (Toobit 5m, 60 min)

on:
  workflow_dispatch: {}

jobs:
  path:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt openpyxl

      - name: Run path analysis
        run: python path60.py

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: path60-results
          path: |
            path60_summary.txt
            path60_signals.csv
